    <path d="M63 30c17.7 0 32 11.4 32 25.5 0 6.4-3 12.3-7.9 16.8l2.6 10.2c.3 1.2-1 2.2-2.1 1.5l-10.4-6c-4.3 1.5-9.1 2.4-14.2 2.4-17.7 0-32-11.4-32-25.4S45.3 30 63 30z" fill="url(#back)" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2"/>
  </g>
